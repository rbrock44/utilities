<a class="tile" [routerLink]="['/', tile.param]" [attr.aria-label]="tile.title + ': ' + tile.description">
    <div class="heading">
        <span class="icon" aria-hidden="true">{{ tile.icon }}</span>
        <h3 class="title">{{ tile.title }}</h3>
    </div>
    <p class="description">{{ tile.description }}</p>
</a>
<button
    type="button"
    class="pin"
    [class.pinned]="favorites.isPinned(tile.param)"
    [attr.aria-pressed]="favorites.isPinned(tile.param)"
    [attr.aria-label]="'Pin ' + tile.title"
    (click)="favorites.toggle(tile.param)">{{ favorites.isPinned(tile.param) ? '★' : '☆' }}</button>
