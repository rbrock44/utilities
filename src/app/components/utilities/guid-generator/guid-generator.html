<section class="widget-container">
  <h2>GUID Generator</h2>
  <p class="description">
    Generate random GUIDs (UUID v4), or time-ordered ones (UUID v7) that sort by creation time,
    which makes them friendlier as database keys.
  </p>

  <div class="inputs">
    <label for="versionInput">
      Version
      <select id="versionInput" [(ngModel)]="version" (ngModelChange)="generate()">
        <option [ngValue]="4">v4 · random</option>
        <option [ngValue]="7">v7 · time-ordered</option>
      </select>
    </label>

    <label for="countInput">
      How many
      <input
        id="countInput"
        type="number"
        min="1"
        step="1"
        [(ngModel)]="count"
        (ngModelChange)="generate()"
      />
    </label>
  </div>

  <button type="button" class="btn-generate" (click)="generate()">Generate</button>

  @if (results.length > 0) {
    <div class="generated-results">
      <div class="results-header">
        <h3>
          Generated Values
          @if (createdAt) {
            <span class="created">created {{ createdAt }}</span>
          }
        </h3>
        <button
          type="button"
          class="btn-copy-all"
          (click)="copyAllToClipboard()"
          aria-label="Copy all values to clipboard"
          title="Copy all to clipboard"
        >
          {{ justCopiedAll ? 'Copied!' : 'Copy All' }}
        </button>
      </div>

      @for (result of results; track $index) {
        <div class="result-row">
          <input type="text" [value]="result" readonly />
          <button
            type="button"
            class="btn-copy"
            (click)="copyToClipboard(result, $index)"
            aria-label="Copy value to clipboard"
            title="Copy to clipboard"
          >
            {{ justCopiedIndex === $index ? 'Copied!' : 'Copy' }}
          </button>
        </div>
      }
    </div>
  }
</section>
